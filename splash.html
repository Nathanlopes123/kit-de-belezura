<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>CNH do Brasil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { --bg: #1c1c1e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .flag {
      width: 190px;
      height: 133px;        /* proporção oficial 10:7 */
      border-radius: 4px;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
      display: block;
    }

    .logo {
      margin-top: 34px;
      text-align: center;
      line-height: .9;
      user-select: none;
    }
    .logo .top {
      font-size: 68px;
      font-weight: 300;      /* "CNH do" fino */
      letter-spacing: 1px;
    }
    .logo .bottom {
      font-size: 78px;
      font-weight: 800;      /* "BRASIL" grosso */
      letter-spacing: 1px;
      margin-top: 2px;
    }

    @media (max-width: 400px) {
      .flag { width: 160px; height: 112px; }
      .logo .top { font-size: 56px; }
      .logo .bottom { font-size: 64px; }
    }
  </style>
</head>
<body>

  <!-- Bandeira do Brasil (SVG, sem dependência externa) -->
  <svg class="flag" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bandeira do Brasil">
    <rect width="1000" height="700" fill="#009b3a"/>
    <path d="M500 70 930 350 500 630 70 350z" fill="#fedf00"/>
    <circle cx="500" cy="350" r="175" fill="#002776"/>
    <clipPath id="globe"><circle cx="500" cy="350" r="175"/></clipPath>

    <g clip-path="url(#globe)">
      <!-- faixa branca diagonal atravessando o círculo inteiro (descendo esq->dir) -->
      <path id="band" d="M318 330 A 350 350 0 0 1 688 392" fill="none"/>
      <use href="#band" stroke="#fff" stroke-width="30"/>
      <text font-size="25" font-family="Arial, sans-serif" font-weight="bold"
            fill="#009b3a" letter-spacing="5" text-anchor="middle" dy="9">
        <textPath href="#band" startOffset="50%">ORDEM E PROGRESSO</textPath>
      </text>

      <!-- estrelas (brancas) -->
      <g fill="#fff">
        <polygon points="0,-7 1.6,-2.2 6.7,-2.2 2.5,1 4,5.9 0,3 -4,5.9 -2.5,1 -6.7,-2.2 -1.6,-2.2" transform="translate(585,300) scale(1)"/>
        <circle cx="500" cy="285" r="5"/>
        <circle cx="408" cy="372" r="6"/>
        <circle cx="372" cy="398" r="4"/>
        <circle cx="430" cy="410" r="5"/>
        <circle cx="470" cy="418" r="4"/>
        <circle cx="398" cy="435" r="6"/>
        <circle cx="445" cy="448" r="4"/>
        <circle cx="510" cy="400" r="7"/>
        <circle cx="548" cy="392" r="4"/>
        <circle cx="505" cy="455" r="6"/>
        <circle cx="478" cy="478" r="4"/>
        <circle cx="560" cy="440" r="5"/>
        <circle cx="600" cy="420" r="6"/>
        <circle cx="635" cy="398" r="4"/>
        <circle cx="612" cy="455" r="4"/>
        <circle cx="575" cy="478" r="5"/>
        <circle cx="528" cy="500" r="4"/>
        <circle cx="500" cy="340" r="4"/>
        <circle cx="455" cy="330" r="4"/>
        <circle cx="540" cy="345" r="3"/>
      </g>
    </g>
  </svg>

  <div class="logo">
    <div class="top">CNH do</div>
    <div class="bottom">BRASIL</div>
  </div>

</body>
</html>
